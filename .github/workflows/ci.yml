name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.6
          cache: pip
      - run: python -m pip install '.[test]'
      - run: python -m pytest
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Validate self-host Compose configuration
        shell: bash
        run: docker compose -f compose.yaml -f compose.selfhost.yaml --env-file deploy/.env.example --profile inference config --quiet
      - name: Reject likely committed secrets
        shell: bash
        run: |
          ! git grep -nI -Ei '(ctx7sk-|sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|password[[:space:]]*=[[:space:]]*[^$<{])' -- . ':!.github/workflows/ci.yml'
